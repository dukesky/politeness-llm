# =============================================================================
# Model roster — verified against OpenRouter /api/v1/models on 2026-06-10.
# Prices are USD per million tokens (pricing.prompt/completion × 1e6).
# provider_order pins backend; allow_fallbacks=False is set in collect.py.
#
# `round`: which collection round an entry belongs to. Entries WITHOUT a
# `round` key are round 1 (absence == 1) — do not retro-tag them. Round-2
# entries carry `round: 2` and were verified on OpenRouter 2026-09-12.
# Round 2 reuses two round-1 entries unchanged as cross-round anchors:
#   deepseek/deepseek-v4-flash and google/gemini-3.5-flash
# (same model_id, same params → their round-1 data is directly comparable;
# do not edit those two entries).
# collect.py ignores unknown keys, so `round` is metadata only; select a
# round-2 model with e.g. --models v4.1-flash,gemini-3.8-flash
# =============================================================================

defaults:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 200              # raised from 50; reasoning tokens count against max_tokens
  n_runs: 2                    # repeats per (model, prompt, pair); overridable per model
  reasoning_effort: "minimal"  # passed as reasoning.effort; overridable per model

models:
  # ── cheap tier (full grid: all pairs × all prompts × n_runs=3) ───────────

  - model_id: openai/gpt-5.4-mini           # latest OpenAI mini as of 2026-06-10
    tier: cheap
    family: openai
    provider_order: ["OpenAI"]              # OpenAI official — closed-source, full precision
    price_per_m_input: 0.75
    price_per_m_output: 4.50
    reasoning_effort: "none"               # GPT-5.1+ supports reasoning suppression

  - model_id: anthropic/claude-haiku-4.5
    tier: cheap
    family: anthropic
    provider_order: ["Anthropic"]           # Anthropic official — closed-source, full precision
    price_per_m_input: 1.00
    price_per_m_output: 5.00
    reasoning_mode: "omit"                 # Anthropic: no reasoning param; effort:minimal enables thinking
    rpm_limit: 100                         # OpenRouter global cap 125 RPM; stay below with margin

  - model_id: google/gemini-3.5-flash
    tier: cheap
    family: google
    provider_order: ["Google"]              # Google AI Studio — closed-source, full precision
    price_per_m_input: 1.50
    price_per_m_output: 9.00

  - model_id: deepseek/deepseek-v4-flash
    tier: cheap
    family: deepseek
    # Round-1 raw data was collected via WandB (fp8). WandB delisted this model
    # by 2026-09-12 (check_providers FAIL), so round-2 anchor collection runs on
    # Baidu — also fp8, uptime 99.997% — DISCLOSE this provider shift in the
    # paper; cross-round DeepSeek comparisons carry a provider-change caveat.
    provider_order: ["Baidu"]
    price_per_m_input: 0.066
    price_per_m_output: 0.131
    reasoning_mode: "disabled"             # sends reasoning.enabled=false to suppress native CoT

  - model_id: qwen/qwen3.7-plus             # Qwen 3.7 instruct (non-reasoning) tier
    tier: cheap
    family: qwen
    provider_order: ["Alibaba"]            # Alibaba official — full precision (quantization: unknown)
    price_per_m_input: 0.40
    price_per_m_output: 1.60
    reasoning_mode: "disabled"             # sends reasoning.enabled=false to suppress native CoT

  # ── flagship tier (20 % subsample, 1 run — reference only) ───────────────

  - model_id: openai/gpt-5.5
    tier: flagship
    family: openai
    provider_order: ["OpenAI"]             # OpenAI official — closed-source, full precision
    price_per_m_input: 5.00
    price_per_m_output: 30.00
    subsample: 0.2
    n_runs: 1
    reasoning_effort: "none"              # GPT-5.1+ supports reasoning suppression

  - model_id: anthropic/claude-opus-4.8
    tier: flagship
    family: anthropic
    provider_order: ["Anthropic"]          # Anthropic official — closed-source, full precision
    price_per_m_input: 5.00
    price_per_m_output: 25.00
    subsample: 0.2
    n_runs: 1
    reasoning_mode: "disabled"            # final attempt to zero reasoning_tokens

  - model_id: google/gemini-3.1-pro-preview  # gemini-3.5-pro not yet on OpenRouter; reasoning-native
    tier: flagship
    family: google
    provider_order: ["Google"]             # Google AI Studio — closed-source, full precision
    price_per_m_input: 2.00
    price_per_m_output: 12.00
    subsample: 0.2
    n_runs: 1
    reasoning_mode: "mandatory"            # API forces reasoning; reasoning_tokens > 0 expected
    max_tokens: 4000                       # reasoning eats into max_tokens; raise to prevent truncation

  # ═══════════════════════════════════════════════════════════════════════
  # ROUND 2 — verified against OpenRouter /api/v1/models on 2026-09-12.
  # Anchors reused from round 1 as-is: deepseek/deepseek-v4-flash,
  # google/gemini-3.5-flash (see header note).
  # ═══════════════════════════════════════════════════════════════════════

  # ── round 2, cheap tier ──────────────────────────────────────────────────

  - model_id: deepseek/deepseek-v4.1-flash
    tier: cheap
    family: deepseek
    round: 2
    # WandB does not serve v4.1-flash; DeepSeek first-party returns HTTP 404
    # for this account (privacy-settings filtering, live-verified 2026-09-12).
    # Pinned to SiliconFlow: fp8 (matches the v4-flash anchor's precision),
    # uptime 100%.
    provider_order: ["SiliconFlow"]
    price_per_m_input: 0.30
    price_per_m_output: 1.20
    price_per_m_input: 0.15
    price_per_m_output: 0.60
    reasoning_mode: "disabled"             # sends reasoning.enabled=false to suppress native CoT

  - model_id: google/gemini-3.8-flash
    tier: cheap
    family: google
    round: 2
    provider_order: ["Google"]             # Google AI Studio — closed-source, full precision
    price_per_m_input: 0.75                # pricing.prompt      7.5e-7 × 1e6
    price_per_m_output: 3.75               # pricing.completion  3.75e-6 × 1e6
    # REASONING-NATIVE: API rejects reasoning.enabled=false ("Reasoning is
    # mandatory for this endpoint", live-verified 2026-09-12). Classified like
    # gemini-3.1-pro-preview: analyzed separately from non-reasoning judges;
    # together they give 2 reasoning judges for the tone x reasoning line.
    reasoning_mode: "mandatory"
    max_tokens: 4000                       # reasoning eats into max_tokens; prevent truncation

  # ── round 2, flagship tier (20 % subsample, 1 run) ───────────────────────

  - model_id: anthropic/claude-opus-5
    tier: flagship
    family: anthropic
    round: 2
    provider_order: ["Anthropic"]          # Anthropic official — closed-source, full precision
    price_per_m_input: 5.00
    price_per_m_output: 25.00
    subsample: 0.2
    n_runs: 1
    reasoning_mode: "disabled"            # zero reasoning_tokens, as for claude-opus-4.8

  - model_id: openai/gpt-5.6-sol
    tier: flagship
    family: openai
    round: 2
    provider_order: ["OpenAI"]             # OpenAI official — closed-source, full precision
    price_per_m_input: 2.00
    price_per_m_output: 10.00
    subsample: 0.2
    n_runs: 1
    reasoning_effort: "none"              # GPT-5.1+ supports reasoning suppression
